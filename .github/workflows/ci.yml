name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build (Node 22 / JDK 17 / API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.2'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266788

      - name: Install SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null

      - name: Install pinned npm dependencies
        run: npm ci

      - name: Set CORDOVA_JAVA_HOME
        run: echo "CORDOVA_JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          npm run env:check
          npm test

      - name: Cordova prepare
        run: npm run prepare:android

      - name: Build unsigned debug APK
        run: npm run debug

      - name: Verify debug APK metadata, permissions, and signature
        run: node scripts/verify-aab.js platforms/android/app/build/outputs/apk/debug/app-debug.apk
