	<script>
        $(document).ready(function() {
			$('#accordion').on('shown.bs.collapse', function () {
			  	var panel = $(this).find('.in');
			  	$('html, body').animate({ 
					scrollTop: panel.offset().top - 100
			  	}, 500);
			});
			
			$("a.other-link").each(function() {
                $(this).on("click", function(){
					currentdatapage=$(this).attr("data-page");
                    $(".main-container").load($(this).attr("data-page")+".html");
					$(".acc-container").load("accordion.html");
               	});
            });
			
			$("a.pdf-link").each(function() {
                $(this).on("click", function(){
                    window.plugins.pdfviewer.showpdf('forms/NDRRMC-'+$(this).attr("data-page")+'.pdf', $(this).attr("data-page"), true);
               	});
            });
			
			var idToToggle = window.location.hash;
			if(idToToggle!=''){
				$('#collapse1').collapse('hide');
    			$(idToToggle).collapse('show');
			};
        });
		// 
    </script>
