<script>
	var server_osrts;
	var onSuccess = function (position) {
		$('#lat').html("Latitude:" + position.coords.latitude);
		$('#long').html("Longitude:" + position.coords.longitude);
		$('#accu').html("Accuracy:" + position.coords.accuracy + " meters");
		$('#gpserror').html('Connected to GPS.');
		var coordsData={
			lat:position.coords.latitude,
            long:position.coords.longitude,
            alt:position.coords.altitude,
            acc:position.coords.accuracy,
            altacc:position.coords.altitudeAccuracy,
            head:position.coords.heading,
            speed:position.coords.speed,
            timestamp:position.timestamp,
    	};
		socket.emit("report",JSON.stringify(coordsData));
	};



	// onError Callback receives a PositionError object
	//
	function onError(error) {
		$('#gpserror').html('Error: ' + error.message + '\n');

	};


	function startGPS() {
		navigator.geolocation.getCurrentPosition(onSuccess, onError);
		//---------------------------

		//---------------------------	
		if (gpsState == true)
			setTimeout(function () { startGPS(); }, 10000);
	}

	var gpsState = false;


</script>
